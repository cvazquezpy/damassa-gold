name: Actualizar Cotizaciones

on:
  schedule:
    # Se ejecuta cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ejecutar script de actualización
        run: |
          # Reemplaza con tu comando real si no usas index.js
          node index.js

      - name: Hacer Commit y Push de los cambios a cotizaciones.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cotizaciones.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: actualización automática de cotizaciones [skip ci]"
          git push
