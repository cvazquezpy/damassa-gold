name: Actualizar Cotizaciones

on:
  # Respaldo interno de GitHub. El disparo principal viene de cron-job.org
  # (ver instrucciones). Minutos desfasados para evitar el pico de carga del minuto 0.
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

# Evita que dos ejecuciones (externa + schedule) choquen al hacer push
concurrency:
  group: actualizar-cotizaciones
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ejecutar script de actualización
        run: node actualizar-cotizaciones.js

      - name: Commit y push de cotizaciones.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cotizaciones.json
          if git diff --staged --quiet; then
            echo "Sin cambios, nada que publicar."
            exit 0
          fi
          git commit -m "chore: actualización automática de cotizaciones"
          git pull --rebase origin main
          git push origin main
