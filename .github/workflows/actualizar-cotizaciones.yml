name: Actualizar cotizaciones

on:
  schedule:
    - cron: '*/15 * * * *'   # cada 15 minutos
  workflow_dispatch:          # permite correrlo a mano desde la pestaña "Actions" de GitHub

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar script de cotizaciones
        run: node actualizar-cotizaciones.js

      - name: Commitear cotizaciones.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cotizaciones.json
          git diff --staged --quiet || git commit -m "Actualiza cotizaciones"
          git push
